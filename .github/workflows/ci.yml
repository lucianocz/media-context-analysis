name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Find-Ffmpeg {
            $cmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            return Get-ChildItem -Path C:\ProgramData\chocolatey -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $ffmpeg = $null
          foreach ($try in 1..3) {
            try { & choco install ffmpeg --no-progress -y } catch { Write-Host $_ }
            $ffmpeg = Find-Ffmpeg
            if ($ffmpeg) { break }
            Start-Sleep -Seconds (15 * $try)
          }
          if (-not $ffmpeg) {
            $dest = Join-Path $env:RUNNER_TEMP "ffmpeg"
            $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dest
            $ffmpeg = Get-ChildItem -Path $dest -Filter ffmpeg.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ffmpeg) { throw "ffmpeg.exe was not installed" }
          Split-Path $ffmpeg | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check FFmpeg
        run: ffmpeg -version
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Coverage
        run: python -m pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Install wheel in a fresh environment
        run: |
          python -m venv .fresh
          .fresh/bin/python -m pip install dist/*.whl
          .fresh/bin/python -c "from media_context_analysis import AnalysisResult, analyze; assert callable(analyze) and AnalysisResult.__name__"
          .fresh/bin/python -m media_context_analysis --help
